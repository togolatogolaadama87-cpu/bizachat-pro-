name: Build BizChat Pro

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Préparer le projet
        shell: bash
        run: |
          rm -rf project
          mkdir -p project

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : aucun fichier ZIP trouvé."
            exit 1
          fi

          echo "ZIP trouvé : $ZIP"
          unzip -q "$ZIP" -d project

          PUBSPEC=$(find project -type f -name "pubspec.yaml" | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERREUR : pubspec.yaml introuvable."
            find project -maxdepth 3 -type f | head -n 100
            exit 1
          fi

          PROJECT_SOURCE=$(dirname "$PUBSPEC")

          echo "Projet Flutter trouvé dans : $PROJECT_SOURCE"

          if [ "$PROJECT_SOURCE" != "project" ]; then
            cp -a "$PROJECT_SOURCE"/. project/
          fi

          test -f project/pubspec.yaml

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Corriger Android compileSdk
        shell: bash
        run: |
          cd project

          if [ -f android/app/build.gradle.kts ]; then
            python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          import re

          s = re.sub(
              r'compileSdk\s*=\s*[^\n]+',
              'compileSdk = 36',
              s
          )

          p.write_text(s)
          print("compileSdk = 36 configuré dans build.gradle.kts")
          PY
          fi

          if [ -f android/app/build.gradle ]; then
            python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          import re

          s = re.sub(
              r'compileSdkVersion\s+\d+',
              'compileSdkVersion 36',
              s
          )

          s = re.sub(
              r'compileSdk\s+\d+',
              'compileSdk 36',
              s
          )

          p.write_text(s)
          print("compileSdk 36 configuré dans build.gradle")
          PY
          fi

          echo "Vérification Android :"
          grep -R "compileSdk" android/app/ || true

      - name: Installer les dépendances
        shell: bash
        run: |
          cd project
          flutter pub get

      - name: Construire APK
        shell: bash
        run: |
          cd project
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Construire AAB
        shell: bash
        run: |
          cd project
          flutter build appbundle --release

      - name: Récupérer APK
        uses: actions/upload-artifact@v4
        with:
          name: BizChatPro-APK
          path: project/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Récupérer AAB
        uses: actions/upload-artifact@v4
        with:
          name: BizChatPro-AAB
          path: project/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
